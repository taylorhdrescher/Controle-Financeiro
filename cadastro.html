<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Controle Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="entrar.css">
</head>
<body class="pagina-auth">
  <div class="auth-card surgir">
    <a href="index.html" class="voltar">&larr; Voltar</a>
    <h1>Criar conta</h1>
    <p class="subtitulo">Leva menos de um minuto.</p>

    <form id="form-cadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Seu nome" autocomplete="name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="voce@email.com" autocomplete="email">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Mínimo de 4 caracteres" autocomplete="new-password">

      <button type="submit" class="botao">Criar conta</button>
    </form>

    <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
  <script src="auth.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
