<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Controle Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="entrar.css">
</head>
<body class="pagina-auth">
  <div class="auth-card">
    <a href="index.html" class="voltar">&larr; Voltar</a>
    <h1>Entrar</h1>
    <p class="subtitulo">Acesse a sua conta para continuar.</p>

    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="voce@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Sua senha">

      <button type="submit" class="botao">Entrar</button>
    </form>

    <p class="troca">Não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </div>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
